[package]
name = "device-battery"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Offline MCHOSE K99 V3 / G87 and Rapoo VT device batteries for fly-island"

[dependencies]
fly-island-plugin-sdk = { path = "../sdk" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
semver = "1"
